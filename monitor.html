<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitors | Bargain PC's</title>
  <meta name="description" content="Shop monitors at Bargain PC's — great prices, delivered across South Africa." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/site.css" />
</head>
<body data-page="shop" data-category="monitor">
  <main>
    <section class="page-head">
      <div class="container">
        <nav class="crumbs" id="shop-crumb" aria-label="Breadcrumb"></nav>
        <h1 id="shop-title">Monitors</h1>
        <p id="shop-blurb"></p>
      </div>
    </section>

    <section class="section" style="padding-bottom:0">
      <div class="container">
        <div class="cat-grid large" id="shop-categories"></div>
      </div>
    </section>

    <div class="container shop">
      <aside class="filters" id="filters" aria-label="Filters"></aside>
      <div>
        <div class="toolbar">
          <div class="count">Showing <strong id="result-count">0</strong> products</div>
          <div class="right">
            <button class="btn btn-ghost filter-toggle" type="button" id="filter-toggle" aria-controls="filters" aria-expanded="false">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4"/></svg> Filters
            </button>
            <select class="field" id="sort" aria-label="Sort products">
              <option value="">Recommended</option>
              <option value="low">Price: low to high</option>
              <option value="high">Price: high to low</option>
              <option value="name">Name: A to Z</option>
            </select>
          </div>
        </div>
        <div class="chips" id="chips"></div>
        <div class="product-grid" id="product-grid"></div>
      </div>
    </div>
  </main>

  <script src="assets/catalog.js"></script>
  <script src="assets/site.js"></script>
</body>
</html>
